<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Fiber LC — review study</title><desc id="desc">Preserved blue adapter family and duplex/simplex count; corrected empty black rectangles with recessed alignment-sleeve detail and latch channel. Exact adapter vendor/polish unspecified. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. LC duplex / SC simplex blue alignment-sleeve adapter families checked; fiber-mode/polish not assigned to all variants. Exact manufacturer part and dimensional tolerances are not established by the catalogue.</desc><defs>
