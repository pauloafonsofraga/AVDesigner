<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">CA-COM — review study</title><desc id="desc">Removed invented wide flange and radial contact arrays; restored square circular-shell proportions and source-observed staggered contact field. Count is source-observed only (9/19); exact insert, gender and key clock remain unresolved. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. Source-observed 9 contact locations; square circular-shell family. ITT Cannon catalogue has many contact configurations, including 9; original thumbnail is insufficient to identify a specific arrangement. Do not replace it with an assumed common 8-pin speaker insert. Gender and mechanical key dimensions unresolved.</desc><defs>
