<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Mini Din 6-Pin — review study</title><desc id="desc">Corrected six-position mini-DIN to manufacturer front-view topology: inner upper pair, wider middle pair, inner lower pair and upper-center rectangular polarizing key. Neutral insert avoids assigning keyboard/mouse role color to a generic mini-DIN entry. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. 6-position polarized mini-DIN reference and original green/purple PS/2 source compared. E-tec MDJ 6-position front drawing visually inspected; six-contact topology and upper central rectangular key corrected. Exact vendor/PS2 color variant of catalogue thumbnail not specified. Socket detail remains illustrative, not a dimensional mating drawing.</desc><defs>
<linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e1e7eb" /><stop offset=".3" stop-color="#9aa6b1" /><stop offset=".65" stop-color="#465360" /><stop offset="1" stop-color="#aab6c0" /></linearGradient>
<linearGradient id="polymer" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#56616b" /><stop offset=".45" stop-color="#252e37" /><stop offset="1" stop-color="#111820" /></linearGradient>
<radialGradient id="gold" cx=".35" cy=".25"><stop stop-color="#ffe6a6" /><stop offset=".6" stop-color="#c69d55" /><stop offset="1" stop-color="#705029" /></radialGradient>
