<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">XLR 5-Pin — review study</title><desc id="desc">Corrected five-contact insert to the source/manufacturer U-shaped pattern: two upper, two lower, one bottom-center; removed invented top-center contact. Female sockets retained. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. Five female contacts; U-shaped arrangement compared with photograph. Exact source model and key dimensions unassigned.</desc><defs>
