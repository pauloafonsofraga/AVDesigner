<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">PowerLock — review study</title><desc id="desc">Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. Manufacturer-authored ITT catalogue distinguishes source male contact in female housing, drain female contact in male housing, both with insulated safety features. Source/drain labels not guessed from signal direction. Old yellow/red center fills corrected to dark insulating safety caps, retaining original circular source/drain geometry and phase-color positions. Exact source part unassigned; source/drain safety-cap profile and phase keying still require the selected manufacturer part. Insulating caps are represented schematically.</desc><defs>
