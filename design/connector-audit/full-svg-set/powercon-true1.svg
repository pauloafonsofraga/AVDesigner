<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">powerCON TRUE1 — review study</title><desc id="desc">Corrected 61:35.4 flange ratio, unequal 23.6/28.4 collars, 28 mm center separation and four mounting holes from NAC3PX-TOP front drawing. Removed invented top latch bar. Historical insert forms retained; exact blade/key profile still needs review. Original thumbnail has reversed outlet/inlet order; selected manufacturer example is inlet left/outlet right. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. NAC3PX-TOP reference front drawing visually inspected: 61:35.4 flange, 28 center spacing, 23.6/28.4 unequal collars and four mounting holes. Exposed/protected forms reconcile reversed historical filenames. Source thumbnail has opposite left/right order and may be Seetronic. Old insert blade/key shapes are not fully model-verified; do not claim exact manufacturer match.</desc><defs>
