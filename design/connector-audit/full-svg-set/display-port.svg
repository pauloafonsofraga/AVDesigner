<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Display Port — review study</title><desc id="desc">Corrected aperture proportions rather than scaling old geometry: low-profile HDMI/DP; taller rectangular mini-DP. Two opposed contact rows (HDMI 10+9, DP/mini-DP 10+10); no anisotropic transforms. Source MiniDisplayPort thumbnail appears inconsistent with a modern mini-DP receptacle; exact part unresolved. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. 20 contacts in two rows and low-profile one-corner chamfered aperture checked. Family illustration, not the identified source SKU or a dimensionally certified drawing.</desc><defs>
