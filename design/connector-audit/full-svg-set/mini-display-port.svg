<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">Mini-Display Port — review study</title><desc id="desc">Corrected aperture proportions rather than scaling old geometry: low-profile HDMI/DP; taller rectangular mini-DP. Two opposed contact rows (HDMI 10+9, DP/mini-DP 10+10); no anisotropic transforms. Source MiniDisplayPort thumbnail appears inconsistent with a modern mini-DP receptacle; exact part unresolved. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. 20-position mini-DP receptacle reference checked; removed nonuniform scale and corrected taller rectangular mouth. Original MiniDisplayPort.png appears to show a different shield/contact form. Catalogue part identity needs confirmation.</desc><defs>
<linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e1e7eb" /><stop offset=".3" stop-color="#9aa6b1" /><stop offset=".65" stop-color="#465360" /><stop offset="1" stop-color="#aab6c0" /></linearGradient>
<linearGradient id="polymer" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#56616b" /><stop offset=".45" stop-color="#252e37" /><stop offset="1" stop-color="#111820" /></linearGradient>
<radialGradient id="gold" cx=".35" cy=".25"><stop stop-color="#ffe6a6" /><stop offset=".6" stop-color="#c69d55" /><stop offset="1" stop-color="#705029" /></radialGradient>
