<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">IEC — review study</title><desc id="desc">Corrected recessed female slots to exposed metal blades: original C13.png depicts a male C14 inlet despite filename. Three contacts and front inlet/flange proportions checked against Schurter C14 reference. Exact source part unknown. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. Original C13.png contains exposed blades: corrected to male C14 physical inlet, 3 contacts. Catalogue name is only IEC and thumbnail filename is misleading. Exact Schurter or other model not supplied.</desc><defs>
<linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e1e7eb" /><stop offset=".3" stop-color="#9aa6b1" /><stop offset=".65" stop-color="#465360" /><stop offset="1" stop-color="#aab6c0" /></linearGradient>
<linearGradient id="polymer" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#56616b" /><stop offset=".45" stop-color="#252e37" /><stop offset="1" stop-color="#111820" /></linearGradient>
<radialGradient id="gold" cx=".35" cy=".25"><stop stop-color="#ffe6a6" /><stop offset=".6" stop-color="#c69d55" /><stop offset="1" stop-color="#705029" /></radialGradient>
</defs><g id="artwork" transform="translate(128 128) scale(1.131313131) translate(-128.000000 -80.000000)"><rect x="30" y="27" width="196" height="106" rx="8" fill="url(#polymer)" stroke="#89949d" stroke-width="2" /><path d="M 88 35 H 168 L 186 55 V 125 H 70 V 55 Z" fill="url(#metal)" /><path d="M 92 43 H 164 L 178 59 V 117 H 78 V 59 Z" fill="#0c1218" /><rect x="123" y="57" width="10" height="20" rx="1" fill="url(#metal)" data-contact="1" /><rect x="98" y="88" width="10" height="20" rx="1" fill="url(#metal)" data-contact="1" /><rect x="148" y="88" width="10" height="20" rx="1" fill="url(#metal)" data-contact="1" /><circle cx="44" cy="80" r="5" fill="url(#metal)" /><circle cx="44" cy="80" r="2.4" fill="#080e13" /><circle cx="212" cy="80" r="5" fill="url(#metal)" /><circle cx="212" cy="80" r="2.4" fill="#080e13" /></g></svg>
