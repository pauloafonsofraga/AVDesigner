<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">USB-B — review study</title><desc id="desc">Corrected USB-B near-square frontal shield and shoulder proportions; retained legacy four-contact interface. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. Legacy 4-position USB-B receptacle family and square shoulder profile checked. Exact manufacturer part and dimensional tolerances are not established by the catalogue.</desc><defs>
