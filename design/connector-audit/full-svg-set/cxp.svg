<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">CXP — review study</title><desc id="desc">Corrected front cage opening proportions and paired top/bottom EMI spring treatment. Removed false bottom tongue. TE 2149152-1 confirms 84 internal positions; recessed contacts are not invented at the mouth. Source model cannot be uniquely assigned. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. TE CXP cage/module family and 84 recessed electrical positions checked; spring fingers are mechanical, not contacts. Source is consistent with a CXP cage, but SKU unassigned. Front artwork omits hidden rear pin layout; not an 84-pin diagram.</desc><defs>
<linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e1e7eb" /><stop offset=".3" stop-color="#9aa6b1" /><stop offset=".65" stop-color="#465360" /><stop offset="1" stop-color="#aab6c0" /></linearGradient>
<linearGradient id="polymer" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#56616b" /><stop offset=".45" stop-color="#252e37" /><stop offset="1" stop-color="#111820" /></linearGradient>
<radialGradient id="gold" cx=".35" cy=".25"><stop stop-color="#ffe6a6" /><stop offset=".6" stop-color="#c69d55" /><stop offset="1" stop-color="#705029" /></radialGradient>
