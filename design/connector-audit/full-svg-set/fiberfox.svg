<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">FiberFox — review study</title><desc id="desc">Removed invented shutter and wide plate; restored D-flange, red collar, opposing alignment jaws and four expanded-beam lenses using NO4M4DW-FX photograph and front drawing. Hermaphroditic optical interface, not electrical pins. Exact catalog thumbnail part remains unassigned. Original WireNexus thumbnail compared visually; existing SVG inspected at 32, 64 and 128 px. Selected NO4M4DW-FX EBC15 4CH reference: hermaphroditic four-lens interface, red collar, opposing jaws, 26:31 flange proportions. Photo and front drawing visually inspected. Selected reference matches visible source family; exact inventory part is not supplied. Jaw profiles and optical spacing remain illustrative, not CAD-certified.</desc><defs>
