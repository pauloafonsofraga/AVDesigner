<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AV Designer Engine Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d141a;
      --panel: #17202a;
      --panel-2: #111922;
      --line: #314253;
      --text: #e8eef7;
      --muted: #9ba9b8;
      --blue: rgb(50, 182, 255);
      --orange: rgb(255, 121, 4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      white-space: nowrap;
    }

    .toolbar strong {
      margin-right: 12px;
      font-size: 14px;
    }

    button,
    select,
    input[type="file"]::file-selector-button {
      border: 1px solid #3b4d61;
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 7px 10px;
      font: inherit;
    }

    button.primary {
      border-color: var(--blue);
      background: #15344a;
    }

    button:hover {
      border-color: var(--blue);
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    #engineCanvas,
    #labelCanvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #engineCanvas {
      background: #0c1218;
      cursor: crosshair;
      z-index: 1;
    }

    #labelCanvas {
      z-index: 2;
      pointer-events: none;
      background: transparent;
    }

    #engineCanvas.panning {
      cursor: grabbing;
    }

    #engineCanvas.dragging {
      cursor: move;
    }

    .hud {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 260px;
      max-width: 320px;
      padding: 10px 12px;
      border: 1px solid rgba(50, 182, 255, .35);
      border-radius: 8px;
      background: rgba(13, 20, 26, .86);
      backdrop-filter: blur(8px);
      color: var(--text);
      pointer-events: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      z-index: 3;
    }

    .hud h2 {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, .07);
      padding: 3px 0;
    }

    .hud-row:first-of-type {
      border-top: 0;
    }

    .hint {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: 620px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 6px;
      background: rgba(13, 20, 26, .74);
      color: var(--muted);
      pointer-events: none;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="toolbar">
      <strong>Engine Prototype</strong>
      <button class="primary" data-generate="small">100 / 300</button>
      <button class="primary" data-generate="medium">1k / 5k</button>
      <button class="primary" data-generate="large">5k / 20k</button>
      <button id="select20">Select 20</button>
      <button id="bench1">Benchmark Drag 1</button>
      <button id="bench20">Benchmark Drag 20</button>
      <button id="fitView">Fit</button>
      <label>
        Load .avd/.json
        <input id="fileInput" type="file" accept=".avd,.json,application/json">
      </label>
    </div>
    <div class="canvas-wrap">
      <canvas id="engineCanvas"></canvas>
      <canvas id="labelCanvas"></canvas>
      <div id="perfHud" class="hud"></div>
      <div class="hint">
        Wheel zooms, middle mouse pans, click a device to select, Shift-click adds/removes, drag selected devices as one group.
      </div>
    </div>
  </div>

  <script type="module">
    import { createEnginePrototype } from "./src/engine/prototypeApp.js";

    createEnginePrototype({
      canvas: document.getElementById("engineCanvas"),
      labelCanvas: document.getElementById("labelCanvas"),
      hud: document.getElementById("perfHud"),
      fileInput: document.getElementById("fileInput"),
      select20Button: document.getElementById("select20"),
      fitButton: document.getElementById("fitView"),
      bench1Button: document.getElementById("bench1"),
      bench20Button: document.getElementById("bench20"),
      generateButtons: [...document.querySelectorAll("[data-generate]")]
    });
  </script>
</body>
</html>
